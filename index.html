<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golden Turf</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0f3d2a;--g2:#1c6b46;--bg:#f4f6ee;--ink:#14201a;--chalk:#fff;--red:#c8372d;--amb:#e5a712;--ln:#cfd8c6}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--g);color:#fff;padding:28px 18px 22px;border-bottom:6px double #fff4}
header h1{margin:0;font-size:30px;line-height:1.2}header p{margin:6px 0 0;opacity:.8}
main{max-width:720px;margin:auto;padding:16px}
h2{font-size:20px;margin:26px 0 10px}
.gal{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.gal img{height:190px;border-radius:6px;flex:none}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:6px;margin-top:10px}
.cal{background:var(--chalk);border:2px solid var(--g);border-radius:6px;padding:10px}
.cb{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.cb button{background:none;border:1px solid var(--ln);border-radius:4px;font-size:20px;padding:2px 12px}
.gr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.gr b{font-size:13px;color:var(--g2)}
.d{padding:10px 0;border:1px solid var(--ln);border-radius:4px;background:#fff;font:inherit}
.d:disabled{opacity:.35}.d.on{background:var(--g);color:#fff;border-color:var(--g)}.d.t{outline:2px solid var(--amb)}
.sl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;margin-bottom:8px;border-radius:6px;border:2px solid var(--g2);background:#fff}
.sl small{display:block;color:#566}
.sl button{background:var(--g2);color:#fff;border:0;border-radius:4px;padding:9px 16px;font:700 15px inherit;font-family:inherit}
.sl.s{border-color:var(--red);background:#fbeceb}.sl.s .tag{color:var(--red);font-weight:700}
.sl.p{border-color:var(--amb);background:#fdf5e0}.sl.p .tag{color:#946a00;font-weight:700}
.md{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}
.md.on{display:flex}.box{background:#fff;width:100%;max-width:520px;border-radius:12px 12px 0 0;padding:18px;max-height:92vh;overflow:auto}
input,textarea{width:100%;padding:11px;margin:4px 0 10px;border:1px solid #9ab;border-radius:4px;font:inherit}
.btn{display:block;width:100%;text-align:center;background:var(--g);color:#fff;border:0;border-radius:6px;padding:13px;font:700 16px inherit;font-family:inherit;text-decoration:none}
.btn.w{background:#1a9d4d}.btn.o{background:#fff;color:var(--g);border:2px solid var(--g)}
.err{color:var(--red);min-height:22px}.note{background:#eef4e6;padding:10px;border-radius:6px;font-size:14px}
.bk{background:#fff;border:1px solid var(--ln);border-left:6px solid var(--amb);border-radius:6px;padding:10px 12px;margin-bottom:8px}
.bk.c{border-left-color:var(--g2)}.bk .r{display:flex;gap:8px;margin-top:8px}.bk .r button{flex:1;padding:9px;border:0;border-radius:4px;color:#fff;font-family:inherit;font-weight:700}
footer{text-align:center;padding:24px;font-size:13px}footer a{color:#566}
.hide{display:none}
</style></head><body>
<header><h1 id="nm">Golden Turf</h1><p>তারিখ বেছে ফাঁকা স্লট বুক করুন</p></header>
<main id="pub">
<div class="gal" id="gal"></div><div id="vd"></div>
<h2>তারিখ বাছুন</h2><div class="cal"><div class="cb"><button id="pv">‹</button><span id="mn"></span><button id="nx">›</button></div><div class="gr" id="gr"></div></div>
<h2 id="dt"></h2><div id="sl"></div>
</main>
<main id="adm" class="hide">
<div id="lg"><h2>অ্যাডমিন লগইন</h2><input id="em" type="email" placeholder="ইমেইল"><input id="pw" type="password" placeholder="পাসওয়ার্ড"><div class="err" id="le"></div><button class="btn" id="li">লগইন</button></div>
<div id="pn" class="hide"><h2>বুকিং কনফার্ম করুন</h2><div id="pl"></div><h2>কনফার্মড বুকিং</h2><div id="cl"></div>
<h2>সেটিংস</h2><label>মাঠের নাম</label><input id="s_n"><label>বিকাশ নম্বর</label><input id="s_b"><label>হোয়াটসঅ্যাপ নম্বর (880 দিয়ে, যেমন 8801XXXXXXXXX)</label><input id="s_w">
<label>স্লট (প্রতি লাইনে: সময়|ভাড়া)</label><textarea id="s_s" rows="8"></textarea>
<label>ছবির লিংক (প্রতি লাইনে একটি)</label><textarea id="s_i" rows="3"></textarea><label>YouTube ভিডিও লিংক</label><input id="s_v">
<button class="btn" id="sv">সেভ করুন</button><button class="btn o" id="lo" style="margin-top:10px">লগআউট</button></div></main>
<footer><a href="#" id="al">অ্যাডমিন</a></footer>
<div class="md" id="md"><div class="box"><h2 id="mt" style="margin-top:0"></h2><div class="note" id="mi"></div><div id="mf"><br>
<label>আপনার নাম</label><input id="f_n"><label>ফোন নম্বর</label><input id="f_p" type="tel" placeholder="01XXXXXXXXX"><label>বিকাশ ট্রানজেকশন আইডি</label><input id="f_t"><div class="err" id="fe"></div>
<button class="btn" id="fs">বুকিং জমা দিন</button></div><div id="ok" class="hide"></div><button class="btn o" id="fc" style="margin-top:10px">বন্ধ করুন</button></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,collection,onSnapshot,writeBatch,query,where}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyBUEhVi7cqGvIWWgsEwLgXhCNQ8HvohqWk",authDomain:"turf-booking-gt.firebaseapp.com",projectId:"turf-booking-gt",storageBucket:"turf-booking-gt.firebasestorage.app",messagingSenderId:"127711522177",appId:"1:127711522177:web:2983afbd679f2d61144c80"});
const db=getFirestore(app),au=getAuth(app),$=i=>document.getElementById(i);
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const fh=h=>{h=h%24;const p=h<12?"AM":"PM";return(h%12||12)+":00 "+p};
const DEF={name:"Golden Turf",bkash:"01676372399",wa:"8801352309648",images:"",video:"",slots:Array.from({length:18},(_,i)=>fh(i+6)+" - "+fh(i+7)+"|1000").join("\n")};
const MN=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"],WD=["রবি","সোম","মঙ্গল","বুধ","বৃহ","শুক্র","শনি"];
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=new Date();today.setHours(0,0,0,0);
let C={...DEF},taken={},sel=new Date(today),vm=new Date(today.getFullYear(),today.getMonth(),1),cur=null,seen=null;
const slots=()=>C.slots.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const[a,b]=l.split("|");return{l:a.trim(),p:+(b||0)}});
function cfg(){$("nm").textContent=C.name;document.title=C.name;
$("gal").innerHTML=C.images.split("\n").filter(u=>u.trim()).map(u=>`<img src="${u.trim()}" alt="">`).join("");
const m=(C.video||"").match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);$("vd").innerHTML=m?`<iframe class="vid" src="https://www.youtube.com/embed/${m[1]}" allowfullscreen></iframe>`:""}
function cal(){$("mn").textContent=MN[vm.getMonth()]+" "+bn(vm.getFullYear());let h=WD.map(w=>`<b>${w}</b>`).join("");
for(let i=0;i<vm.getDay();i++)h+="<span></span>";const n=new Date(vm.getFullYear(),vm.getMonth()+1,0).getDate();
for(let d=1;d<=n;d++){const x=new Date(vm.getFullYear(),vm.getMonth(),d);h+=`<button class="d ${key(x)==key(sel)?"on":""} ${x.getTime()==today.getTime()?"t":""}" data-d="${key(x)}" ${x<today?"disabled":""}>${bn(d)}</button>`}
$("gr").innerHTML=h}
function list(){const k=key(sel);$("dt").textContent=bn(sel.getDate())+" "+MN[sel.getMonth()]+", "+WD[sel.getDay()]+"বার";
$("sl").innerHTML=slots().map((s,i)=>{const st=taken[k+"_"+i];
if(st=="confirmed")return`<div class="sl s"><div>${s.l}</div><span class="tag">সোল্ড আউট</span></div>`;
if(st=="pending")return`<div class="sl p"><div>${s.l}</div><span class="tag">অপেক্ষমাণ</span></div>`;
return`<div class="sl"><div>${s.l}<small>৳${bn(s.p)}</small></div><button data-i="${i}">বুক নাও</button></div>`}).join("")}
$("pv").onclick=()=>{vm=new Date(vm.getFullYear(),vm.getMonth()-1,1);cal()};$("nx").onclick=()=>{vm=new Date(vm.getFullYear(),vm.getMonth()+1,1);cal()};
$("gr").onclick=e=>{const b=e.target.closest("[data-d]");if(!b)return;const[y,m,d]=b.dataset.d.split("-");sel=new Date(+y,m-1,+d);cal();list()};
$("sl").onclick=e=>{const b=e.target.closest("[data-i]");if(!b)return;const s=slots()[b.dataset.i];cur={i:+b.dataset.i,s,k:key(sel)};
$("mt").textContent=s.l+" ("+bn(sel.getDate())+" "+MN[sel.getMonth()]+")";
$("mi").innerHTML=`ভাড়া <b>৳${bn(s.p)}</b>। আগে বিকাশ করুন: <b>${C.bkash||"(নম্বর সেট করা হয়নি)"}</b> (Send Money), তারপর নিচে ট্রানজেকশন আইডি দিন।`;
$("mf").classList.remove("hide");$("ok").classList.add("hide");$("fe").textContent="";$("md").classList.add("on")};
$("fc").onclick=()=>$("md").classList.remove("on");
$("fs").onclick=async()=>{const n=$("f_n").value.trim(),p=$("f_p").value.trim(),t=$("f_t").value.trim().toUpperCase();
if(!n)return $("fe").textContent="নাম দিন";if(!/^01\d{9}$/.test(p))return $("fe").textContent="ঠিক ১১ সংখ্যার ফোন নম্বর দিন (01XXXXXXXXX)";if(!/^[A-Z0-9]{8,20}$/.test(t))return $("fe").textContent="বিকাশের ট্রানজেকশন আইডি ঠিকভাবে দিন";
const id=cur.k+"_"+cur.i,b=writeBatch(db);b.set(doc(db,"taken",id),{d:cur.k,s:"pending"});
b.set(doc(db,"bookings",id),{d:cur.k,idx:cur.i,label:cur.s.l,price:cur.s.p,name:n,phone:p,trx:t,status:"pending",t:Date.now()});
$("fs").disabled=true;try{await b.commit();$("mf").classList.add("hide");
const msg=encodeURIComponent(`নতুন বুকিং\nতারিখ: ${cur.k}\nস্লট: ${cur.s.l}\nনাম: ${n}\nফোন: ${p}\nবিকাশ TrxID: ${t}`);
$("ok").innerHTML=`<p><b>বুকিং জমা হয়েছে।</b> আমরা ট্রানজেকশন আইডি যাচাই করে কনফার্ম করব। দ্রুত কনফার্মেশনের জন্য হোয়াটসঅ্যাপে জানান:</p>${C.wa?`<a class="btn w" target="_blank" href="https://wa.me/${C.wa}?text=${msg}">হোয়াটসঅ্যাপে পাঠান</a>`:""}`;$("ok").classList.remove("hide")}
catch(e){$("fe").textContent="স্লটটি এইমাত্র অন্য কেউ নিয়ে নিয়েছে বা ইন্টারনেটে সমস্যা। অন্য স্লট বেছে নিন।"}$("fs").disabled=false};
onSnapshot(query(collection(db,"taken"),where("d",">=",key(today))),s=>{taken={};s.forEach(d=>taken[d.id]=d.data().s);list()});
getDoc(doc(db,"config","main")).then(s=>{if(s.exists())C={...DEF,...s.data()};cfg();list()}).catch(()=>{});
cfg();cal();list();
// ---- admin ----
$("al").onclick=e=>{e.preventDefault();$("pub").classList.add("hide");$("adm").classList.remove("hide")};
$("li").onclick=async()=>{try{await signInWithEmailAndPassword(au,$("em").value.trim(),$("pw").value)}catch(e){$("le").textContent="ইমেইল বা পাসওয়ার্ড ভুল"}};
$("lo").onclick=()=>{signOut(au);location.reload()};
const beep=()=>{try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.6)}catch(e){}};
let unsub=null;
onAuthStateChanged(au,u=>{if(!u){$("lg").classList.remove("hide");$("pn").classList.add("hide");return}
$("lg").classList.add("hide");$("pn").classList.remove("hide");
$("s_n").value=C.name;$("s_b").value=C.bkash;$("s_w").value=C.wa;$("s_s").value=C.slots;$("s_i").value=C.images;$("s_v").value=C.video;
unsub=onSnapshot(query(collection(db,"bookings"),where("d",">=",key(today))),s=>{const all=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.d.localeCompare(b.d)||a.idx-b.idx);
const P=all.filter(b=>b.status=="pending"),Cn=all.filter(b=>b.status=="confirmed");
if(seen!==null&&P.some(b=>!seen.has(b.id))){beep();document.title="🔔 নতুন বুকিং!"}seen=new Set(P.map(b=>b.id));
const card=b=>`<div class="bk ${b.status=="confirmed"?"c":""}"><b>${b.d}</b> | ${b.label}<br>${b.name} • ${b.phone}<br>TrxID: <b>${b.trx}</b> • ৳${b.price}<div class="r">${b.status=="pending"?`<button style="background:#1c6b46" data-ok="${b.id}">কনফার্ম</button>`:""}<button style="background:#c8372d" data-no="${b.id}">${b.status=="pending"?"বাতিল":"স্লট খালি করুন"}</button></div></div>`;
$("pl").innerHTML=P.map(card).join("")||"<p>কোনো পেন্ডিং বুকিং নেই।</p>";$("cl").innerHTML=Cn.map(card).join("")||"<p>নেই।</p>"})});
$("adm").onclick=async e=>{const o=e.target.dataset.ok,n=e.target.dataset.no;if(!o&&!n)return;const b=writeBatch(db);
if(o){b.update(doc(db,"taken",o),{s:"confirmed"});b.update(doc(db,"bookings",o),{status:"confirmed"})}
else{if(!confirm("নিশ্চিত?"))return;b.delete(doc(db,"taken",n));b.delete(doc(db,"bookings",n))}
try{await b.commit()}catch(x){alert("ব্যর্থ: "+x.message)}};
$("sv").onclick=async()=>{const v={name:$("s_n").value,bkash:$("s_b").value.trim(),wa:$("s_w").value.trim(),slots:$("s_s").value,images:$("s_i").value,video:$("s_v").value.trim()};
try{await setDoc(doc(db,"config","main"),v);C={...DEF,...v};cfg();list();alert("সেভ হয়েছে")}catch(x){alert("ব্যর্থ: "+x.message)}};
</script></body></html>
